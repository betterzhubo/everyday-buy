<!DOCTYPE html>
<html lang="zh-cn" xmlns:th="http://www.thymeleaf.org">
<head>

  <title>轮播图</title>
  <!-- Bootstrap -->
  <link rel="stylesheet" href="static/asset/lib/bootstrap-2.3.2/css/bootstrap.min.css" media="screen">
  <link rel="stylesheet" href="static/asset/lib/bootstrap-2.3.2/css/bootstrap-responsive.min.css" media="screen">
  <!-- FontAwesome -->
  <link rel="stylesheet" href="static/asset/lib/font-awesome-4.2.0/css/font-awesome.min.css">
  <!-- DataTables CSS start-->
  <link rel="stylesheet" href="static/asset/lib/dataTables-1.10.7/plugins/integration/bootstrap/2/dataTables.bootstrap.css">
  <link rel="stylesheet" href="static/asset/lib/dataTables-1.10.7/plugins/integration/font-awesome/dataTables.fontAwesome.css">
  <!-- DataTables CSS end-->

  <link rel="stylesheet" href="static/asset/css/main.css">
</head>
<body>
<div class="container-fluid">
  <div class="row-fluid">
    <div class="span12" id="content">
      <div class="row-fluid">
        <div class="span12">
          <div class="btn-toolbar">
            <button type="button" class="btn btn-primary" id="btn-add"><i class="fa fa-plus"></i> 添加</button>
          </div>
        </div>
      </div>

      <div class="block info-block" id="user-edit" style="display:none;">
        <div class="navbar navbar-inner block-header" id="banner-edit-head">
          <div class="block-title">修改轮播图:<span id="title-edit"></span></div>
          <div class="header-buttons">
            <button type="button" class="btn btn-primary" id="btn-save-edit">保存更改</button>
            <button type="button" class="btn btn-cancel">取消</button>
          </div>
        </div>
        <div class="navbar navbar-inner block-header" id="banner-add-head">
          <div class="block-title">添加轮播图</div>
          <div class="header-buttons">
            <button type="button" class="btn btn-primary" id="btn-save-add">确定添加</button>
            <button type="button" class="btn btn-cancel">取消</button>
          </div>
        </div>
        <div class="block-content info-content clearfix">
          <form id="form-edit">
            <div class="control-group">
              <label class="control-label" for="banner-edit">
                <span class="red-asterisk">*</span>轮播图名称:</label>
              <div class="controls">
                <input type="text" id="banner-edit" name="banner-edit">
              </div>
            </div>
            <div class="control-group">
              <label class="control-label" for="is-show-edit">显示:</label>
              <div class="add-tag">
                <input type="radio" id="is-show-edit" name="show-edit" value="1">
              </div>

              <label class="control-label" for="un-show-edit">隐藏:</label>
              <div class="add-tag">
                <input type="radio" id="un-show-edit" name="show-edit" value="0">
              </div>
            </div>


            <div class="control-group">
              <label class="control-label" style="width:100px;padding-left:40px;cursor: default" for="banner-image-edit">轮播图片:</label>
              <div class="add-tag" id="banner-image-edit">
              </div>
              <label for="upload-file" class="btn btn-default">上传图片</label>
              <input id="upload-file" type="file" accept="image/png, image/jpeg, image/gif, image/jpg" style="display: none"/>
            </div>

            <div class="control-group">
              <label class="control-label" for="page-url-edit">
                <span class="red-asterisk">*</span>跳转地址:</label>
              <div class="controls">
                <input type="text" id="page-url-edit" name="page-url-edit">
              </div>
            </div>

          </form>
        </div>
      </div>
      <div class="row-fluid">
        <div class="span12" id="div-table-container">
          <table class="table table-striped table-bordered table-hover table-condensed" id="table-banner" cellspacing="0" width="100%">
            <thead>
            <tr>
              <th>轮播图名称</th>
              <th>排序</th>
              <th>是否显示</th>
              <th>轮播图片</th>
              <th>跳转地址</th>
              <th>操作</th>
            </tr>
            </thead>
            <tbody>
            </tbody>

          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="outer-div" style="position:fixed;top:0;left:0;background:rgba(0,0,0,0.7);z-index:2;width:100%;height:100%;display:none;">
  <div id="inner-div" style="position:absolute;">
    <img id="big-img" style="border:5px solid #fff;" src="" />
  </div>
</div>

<script src="static/asset/lib/json2.js"></script>
<!-- JQuery -->
<script src="static/asset/lib/jquery-1.11.3.min.js"></script>
<!-- Bootstrap -->
<script src="static/asset/lib/bootstrap-2.3.2/js/bootstrap.min.js"></script>
<!-- SpinJS-->
<script src="static/asset/lib/spin-2.1.0/jquery.spin.merge.js"></script>
<!-- lhgdialog -->
<script src="static/asset/lib/lhgdialog-4.2.0/lhgdialog.js?skin=bootstrap2"></script>
<!-- DataTables JS-->
<script src="static/asset/lib/dataTables-1.10.7/media/js/jquery.dataTables.js"></script>
<script src="static/asset/lib/dataTables-1.10.7/plugins/integration/bootstrap/2/dataTables.bootstrap.js"></script>
<!-- DataTables JS end-->
<script src="static/asset/js/constant.js"></script>
<script src="static/asset/js/common.js"></script>
<script src="static/asset/js/banner.js"></script>
</body>
</html>
