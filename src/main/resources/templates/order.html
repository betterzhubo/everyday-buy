<!DOCTYPE html>
<html lang="zh-cn" xmlns:th="http://www.thymeleaf.org">
<head>

  <title>订单</title>
  <!-- Bootstrap -->
  <link rel="stylesheet" href="asset/lib/bootstrap-2.3.2/css/bootstrap.min.css" media="screen">
  <link rel="stylesheet" href="asset/lib/bootstrap-2.3.2/css/bootstrap-responsive.min.css" media="screen">
  <!-- FontAwesome -->
  <link rel="stylesheet" href="asset/lib/font-awesome-4.2.0/css/font-awesome.min.css">
  <!-- DataTables CSS start-->
  <link rel="stylesheet" href="asset/lib/dataTables-1.10.7/plugins/integration/bootstrap/2/dataTables.bootstrap.css">
  <link rel="stylesheet" href="asset/lib/dataTables-1.10.7/plugins/integration/font-awesome/dataTables.fontAwesome.css">
  <!-- DataTables CSS end-->

  <link rel="stylesheet" href="asset/css/main.css">
</head>
<body>
<div class="container-fluid">
  <div class="row-fluid">
    <div class="span12" id="content">
      <div class="row-fluid" id="div-advanced-search">
        <form class="form-inline well">
          <div class="row-fluid">
            <span>订单号:</span>
            <input type="text" class="input-medium" placeholder="订单号" id="id-search">
            <span>用户名:</span>
            <input type="text" class="input-medium" placeholder="用户名" id="user-name-search">
            <span>订单状态:</span>
            <select class="input-small" id="order-status-search">
              <option value="">全部</option>
              <option value="1">待支付</option>
              <option value="2">待配送</option>
              <option value="3">配送中</option>
              <option value="4">已完成</option>
              <option value="5">已取消</option>
            </select>

            <button type="button" class="btn" id="btn-advanced-search"><i class="fa fa-search"></i> 查询</button>
          </div>
        </form>
      </div>
      <div class="block info-block" id="order-goods-view">
        <div class="navbar navbar-inner block-header">
          <div class="block-title">订单商品详情</div>

        </div>
        <div class="block-content info-content clearfix">
          <div class="row-fluid" id="order-goods-item" style="display: none">
            <div class="span3">
              <label class="prop-name">商品名:</label>
              <div class="prop-value" name="goods-name-view"></div>
            </div>
            <div class="span3">
              <label class="prop-name">价格:</label>
              <div class="prop-value" name="price-view"></div>
            </div>
            <div class="span3">
              <label class="prop-name">商品数量:</label>
              <div class="prop-value" name="goods-count-view"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="block info-block" id="order-edit" style="display:none;">
        <div class="navbar navbar-inner block-header" id="goods-edit-head">
          <div class="block-title">修改订单:<span id="title-edit"></span></div>
          <div class="header-buttons">
            <button type="button" class="btn btn-primary" id="btn-save-edit">保存更改</button>
            <button type="button" class="btn btn-cancel">取消</button>
          </div>
        </div>

        <div class="block-content info-content clearfix">
          <form id="form-edit">
            <div class="control-group">
              <label class="control-label" for="consignee-name-edit">
                <span class="red-asterisk">*</span>收货人:</label>
              <div class="controls">
                <input type="text" id="consignee-name-edit" name="consignee-name-edit">
              </div>
            </div>
            <div class="control-group">
              <label class="control-label" for="consignee-mobile-edit">
                <span class="red-asterisk">*</span>收货人电话:</label>
              <div class="controls">
                <input type="text" id="consignee-mobile-edit" name="consignee-mobile-edit">
              </div>
            </div>
            <div class="control-group">
              <label class="control-label" for="consignee-address-edit">
                  <span class="red-asterisk">*</span>收货地址:</label>
              <div class="controls">
                  <input type="text" id="consignee-address-edit" name="consignee-address-edit">
              </div>
          </div>
          <div class="control-group">
            <label class="control-label" for="order-status-edit">订单状态:</label>
            <div class="controls">
              <select id="order-status-edit" name="order-status-edit">
                  <option value="1">待支付</option>
                  <option value="2">待配送</option>
                  <option value="3">配送中</option>
                  <option value="4">已完成</option>
                  <option value="5">已取消</option>
              </select>
            </div>
          </div>

          </form>
        </div>
      </div>
      <div class="row-fluid">
        <div class="span12" id="div-table-container">
          <table class="table table-striped table-bordered table-hover table-condensed" id="table-order" cellspacing="0" width="100%">
            <thead>
            <tr>
              <th>订单号</th>
              <th>用户名</th>
              <th>收货人</th>
              <th>收货电话</th>
              <th>收货地址</th>
              <th>订单状态</th>
              <th>操作</th>
            </tr>
            </thead>
            <tbody>
            </tbody>

          </table>
        </div>
      </div>
    </div>
  </div>
</div>


<script th:inline="javascript">
  var userList = [[${userList}]];
</script>

<script src="asset/lib/json2.js"></script>
<!-- JQuery -->
<script src="asset/lib/jquery-1.11.3.min.js"></script>
<!-- Bootstrap -->
<script src="asset/lib/bootstrap-2.3.2/js/bootstrap.min.js"></script>
<!-- SpinJS-->
<script src="asset/lib/spin-2.1.0/jquery.spin.merge.js"></script>
<!-- lhgdialog -->
<script src="asset/lib/lhgdialog-4.2.0/lhgdialog.js?skin=bootstrap2"></script>
<!-- DataTables JS-->
<script src="asset/lib/dataTables-1.10.7/media/js/jquery.dataTables.js"></script>
<script src="asset/lib/dataTables-1.10.7/plugins/integration/bootstrap/2/dataTables.bootstrap.js"></script>
<!-- DataTables JS end-->
<script src="asset/js/constant.js"></script>
<script src="asset/js/order-table.js"></script>
</body>
</html>
