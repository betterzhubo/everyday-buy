<!DOCTYPE html>
<html lang="zh-cn" xmlns:th="http://www.thymeleaf.org">
<head>

<title>商品</title>
<!-- Bootstrap -->
<link rel="stylesheet" href="asset/lib/bootstrap-2.3.2/css/bootstrap.min.css" media="screen">
<link rel="stylesheet" href="asset/lib/bootstrap-2.3.2/css/bootstrap-responsive.min.css" media="screen">
<!-- FontAwesome -->
<link rel="stylesheet" href="asset/lib/font-awesome-4.2.0/css/font-awesome.min.css">
<!-- DataTables CSS start-->
<link rel="stylesheet" href="asset/lib/dataTables-1.10.7/plugins/integration/bootstrap/2/dataTables.bootstrap.css">
<link rel="stylesheet" href="asset/lib/dataTables-1.10.7/plugins/integration/font-awesome/dataTables.fontAwesome.css">
<!-- DataTables CSS end-->

<link rel="stylesheet" href="asset/css/main.css">
</head>
<body>
	<div class="container-fluid">
		<div class="row-fluid">
			<div class="span12" id="content">
				<div class="row-fluid">
					<div class="span12">
						<div class="btn-toolbar">
							<button type="button" class="btn btn-primary" id="btn-add"><i class="fa fa-plus"></i> 添加</button>
						</div>
					</div>
				</div>
				<div class="row-fluid" id="div-advanced-search">
					<form class="form-inline well">
						<div class="row-fluid">
							<span>商品名:</span>
							<input type="text" class="input-medium" placeholder="商品名" id="goods-name-search">
							<span>最低价:</span>
							<input type="text" class="input-small" placeholder="最低价" id="min-price-search">
							<span>最高价:</span>
							<input type="text" class="input-small" placeholder="最高价" id="max-price-search">
							<span>商品类型:</span>
							<select type="text" class="input-medium" placeholder="商品类型" id="goods-type-search">
								<option value="">全部</option>
								<option th:each="item:${goodsTypeList}" th:value="${item.id}">
									[[${item.goodsType}]]
								</option>
							</select>
							<span>商品用途:</span>
							<select class="input-small" id="purpose-search">
								<option value="">全部</option>
								<option value="1">自由</option>
								<option value="0">餐饮</option>
							</select>
							<span>商品上架:</span>
							<select class="input-small" id="selling-search">
								<option value="">全部</option>
								<option value="1">上架</option>
								<option value="0">下架</option>
							</select>
							<button type="button" class="btn" id="btn-advanced-search"><i class="fa fa-search"></i> 查询</button>
						</div>
					</form>
				</div>
				<div class="block info-block" id="user-view">
					<div class="navbar navbar-inner block-header">
						<div class="block-title">商品详情</div>

					</div>
					<div class="block-content info-content clearfix">
						<div class="row-fluid">

							<div class="span3">
								<label class="prop-name">商品名:</label>
								<div class="prop-value" id="goods-name-view"></div>
							</div>
							<div class="span3">
								<label class="prop-name">价格:</label>
								<div class="prop-value" id="price-view"></div>
							</div>
							<div class="span3">
								<label class="prop-name">商品类型:</label>
								<div class="prop-value" id="goods-type-view"></div>
							</div>
							<div class="span3">
								<label class="prop-name">商品用途:</label>
								<div class="prop-value" id="purpose-view"></div>
							</div>
						</div>
						<div class="row-fluid">
							<div class="span3">
								<label class="prop-name">商品上架:</label>
								<div class="prop-value" id="selling-view"></div>
							</div>
							<div class="span3">
								<label class="prop-name">商品展示图片:</label>
								<div class="prop-value" id="show-image-view"></div>
							</div>
							<div class="span3">
								<label class="prop-name">商品轮播图片:</label>
								<div class="prop-value" id="banner-image-view">
									<a style="cursor: pointer">查看图片</a>
								</div>
							</div>
							<div class="span3">
								<label class="prop-name">商品详情图片:</label>
								<div class="prop-value" id="detail-image-view">
									<a style="cursor: pointer">查看图片</a>
								</div>
						</div>
					</div>
				</div>
				</div>
				<div class="block info-block" id="goods-image-list" style="display:none;">
					<div class="navbar navbar-inner block-header">
						<div class="block-title">商品图片</div>
						<div class="header-buttons">
							<button type="button" class="btn btn-primary" id="btn-save-img">保存图片</button>
							<button type="button" class="btn btn-back">返回</button>
						</div>
					</div>

					<div class="block-content info-content clearfix">
						<div class="picDiv">
							<div class="addImages">

								<input type="file" class="file" id="fileInput" multiple="" accept="image/png, image/jpeg, image/gif, image/jpg">
								<div class="text-detail">
									<span>+</span>
									<p>添加图片</p>
								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="block info-block" id="user-edit" style="display:none;">
					<div class="navbar navbar-inner block-header" id="goods-edit-head">
						<div class="block-title">修改商品:<span id="title-edit"></span></div>
						<div class="header-buttons">
							<button type="button" class="btn btn-primary" id="btn-save-edit">保存更改</button>
							<button type="button" class="btn btn-cancel">取消</button>
						</div>
					</div>
					<div class="navbar navbar-inner block-header" id="goods-add-head">
						<div class="block-title">添加商品</div>
						<div class="header-buttons">
							<button type="button" class="btn btn-primary" id="btn-save-add">确定添加</button>
							<button type="button" class="btn btn-cancel">取消</button>
						</div>
					</div>
					<div class="block-content info-content clearfix">
						<form id="form-edit">
							<div class="control-group">
								<label class="control-label" for="goods-name-edit">
									<span class="red-asterisk">*</span>商品名:</label>
								<div class="controls">
									<input type="text" id="goods-name-edit" name="goods-name-edit">
								</div>
							</div>
							<div class="control-group">
								<label class="control-label" for="price-edit">价格:</label>
								<div class="controls">
									<input type="number" id="price-edit" step="0.1" name="price-edit">
								</div>
							</div>
							<div class="control-group">
								<label class="control-label" for="goods-type-edit">商品类型:</label>
								<div class="controls">
									<select id="goods-type-edit" name="goods-type-edit">
										<option th:each="item:${goodsTypeList}" th:value="${item.id}">
											[[${item.goodsType}]]
										</option>
									</select>
								</div>
							</div><div class="control-group">
							<label class="control-label" for="purpose-edit">商品用途:</label>
							<div class="controls">
								<select id="purpose-edit" name="purpose-edit">
									<option value="0">餐饮</option>
									<option value="1">自用</option>
								</select>
							</div>
						</div>
							<div class="control-group">
								<label class="control-label" for="selling-edit">上架:</label>
								<div class="add-tag">
									<input type="radio" id="selling-edit" name="sell-edit" value="1">
								</div>

								<label class="control-label" for="un-selling-edit">下架:</label>
								<div class="add-tag">
									<input type="radio" id="un-selling-edit" name="sell-edit" value="0">
								</div>
							</div>
							<div class="control-group">
								<label class="control-label" style="width:100px;padding-left:40px;cursor: default" for="show-image-edit">商品展示图片:</label>
								<div class="add-tag" id="show-image-edit">
								</div>
                                <label for="upload-file" class="btn btn-default">上传图片</label>
                                <input id="upload-file" type="file" accept="image/png, image/jpeg, image/gif, image/jpg" style="display: none"/>
							</div>
							<div id="banner-image-div" class="control-group">
								<label class="control-label" style="width:100px;padding-left:40px;cursor: default" for="show-image-edit">商品轮播图片:</label>
								<div class="add-tag">
									<a id="banner-image-edit" style="cursor: pointer" name="banner-image-edit">编辑图片</a>
								</div>
							</div>
							<div id="detail-image-div" class="control-group">
								<label class="control-label" style="width:100px;padding-left:40px;cursor: default" for="detail-image-edit">商品详情图片:</label>
								<div class="add-tag">
									<a id="detail-image-edit" style="cursor: pointer" name="detail-image-edit">编辑图片</a>
								</div>
							</div>
						</form>
					</div>
				</div>
				<div class="row-fluid">
					<div class="span12" id="div-table-container">
						<table class="table table-striped table-bordered table-hover table-condensed" id="table-goods" cellspacing="0" width="100%">
							<thead>
								<tr>
									<th>商品名</th>
									<th>价格(单位:元)</th>
									<th>商品类型</th>
									<th>商品用途</th>
									<th>商品状态</th>
									<th>操作</th>
								</tr>
							</thead>
							<tbody>
							</tbody>

						</table>
					</div>
				</div>
			</div>
		</div>
	</div>

    <div id="outer-div" style="position:fixed;top:0;left:0;background:rgba(0,0,0,0.7);z-index:2;width:100%;height:100%;display:none;">
        <div id="inner-div" style="position:absolute;">
            <img id="big-img" style="border:5px solid #fff;" src="" />
        </div>
    </div>

	<script th:inline="javascript">
		var goodsTypeList = [[${goodsTypeList}]];
	</script>

    <script src="asset/lib/json2.js"></script>
	<!-- JQuery -->
	<script src="asset/lib/jquery-1.11.3.min.js"></script>
	<!-- Bootstrap -->
	<script src="asset/lib/bootstrap-2.3.2/js/bootstrap.min.js"></script>
	<!-- SpinJS-->
	<script src="asset/lib/spin-2.1.0/jquery.spin.merge.js"></script>
	<!-- lhgdialog -->
	<script src="asset/lib/lhgdialog-4.2.0/lhgdialog.js?skin=bootstrap2"></script>
	<!-- DataTables JS-->
	<script src="asset/lib/dataTables-1.10.7/media/js/jquery.dataTables.js"></script>
	<script src="asset/lib/dataTables-1.10.7/plugins/integration/bootstrap/2/dataTables.bootstrap.js"></script>
	<!-- DataTables JS end-->
	<script src="asset/js/constant.js"></script>
	<script src="asset/js/goods-table.js"></script>
</body>
</html>
